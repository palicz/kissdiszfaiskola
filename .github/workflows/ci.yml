name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests (with coverage)
        run: pnpm run test:unit

  integration:
    name: Integration (Payload + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Not production: allows Drizzle dev schema push on first connect (empty DB has no tables yet).
      # Incremental migrations alone cannot bootstrap a fresh database; production uses migrate on deploy.
      NODE_ENV: test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      PAYLOAD_SECRET: ci-github-actions-payload-secret-not-for-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm run test:int

      - name: Clear dev schema-push migration markers
        # test:int leaves Drizzle dev-push rows (batch = -1); production Payload migrate prompts interactively.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y postgresql-client
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'DELETE FROM payload_migrations WHERE batch = -1;'

      - name: Build
        # Runs after test:int schema push so generateStaticParams can connect (see tests/int/README.md).
        run: |
          pnpm exec cross-env NODE_OPTIONS=--no-deprecation payload generate:importmap
          pnpm exec cross-env NODE_ENV=production NODE_OPTIONS=--no-deprecation payload migrate
          pnpm exec cross-env NODE_ENV=production NODE_OPTIONS=--no-deprecation next build
